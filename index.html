<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
    />

    <!-- Primary SEO Meta Tags -->
    <title>Nordic Living — Handcrafted Scandinavian Furniture & Decor</title>
    <meta
      name="title"
      content="Nordic Living — Handcrafted Scandinavian Furniture & Decor"
    />
    <meta
      name="description"
      content="Curated timeless Scandinavian furniture and lighting, handcrafted sustainably in Copenhagen. Discover minimalist aesthetics built for lifetimes."
    />
    <meta
      name="keywords"
      content="Scandinavian furniture, Nordic design, minimalist decor, modern chairs, lighting, Copenhagen"
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#F7F5F0" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://nordic-living-ecommerce.vercel.app/"
    />
    <meta
      property="og:title"
      content="Nordic Living — Handcrafted Scandinavian Furniture & Decor"
    />
    <meta
      property="og:description"
      content="Curated timeless Scandinavian furniture and lighting. Discover minimalist aesthetics built for lifetimes."
    />
    <meta property="og:image" content="/images/products/hero-background.webp" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Nordic Living — Handcrafted Scandinavian Furniture"
    />
    <meta
      name="twitter:description"
      content="Curated timeless Scandinavian furniture and lighting."
    />
    <meta
      name="twitter:image"
      content="/images/products/hero-background.webp"
    />

    <!-- Preload Critical LCP Hero Image -->
    <link
      rel="preload"
      as="image"
      href="/images/products/hero-background.webp"
      fetchpriority="high"
    />

    <!-- Performance Preconnects for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />

    <!-- Non-Blocking Google Fonts Loading -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

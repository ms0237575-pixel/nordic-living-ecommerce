<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
    />

    <!-- Primary SEO Meta Tags -->
    <title>Nordic Living — Handcrafted Scandinavian Furniture & Decor</title>
    <meta
      name="title"
      content="Nordic Living — Handcrafted Scandinavian Furniture & Decor"
    />
    <meta
      name="description"
      content="Curated timeless Scandinavian furniture and lighting, handcrafted sustainably in Copenhagen. Discover minimalist aesthetics built for lifetimes."
    />
    <meta
      name="keywords"
      content="Scandinavian furniture, Nordic design, minimalist decor, modern chairs, lighting, Copenhagen"
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#F7F5F0" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nordic-living.vercel.app/" />
    <meta
      property="og:title"
      content="Nordic Living — Handcrafted Scandinavian Furniture & Decor"
    />
    <meta
      property="og:description"
      content="Curated timeless Scandinavian furniture and lighting. Discover minimalist aesthetics built for lifetimes."
    />
    <meta
      property="og:image"
      content="https://images.unsplash.com/photo-1586023492125-27b2c045efd7?q=80&w=1200&auto=format&fit=crop"
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Nordic Living — Handcrafted Scandinavian Furniture"
    />
    <meta
      name="twitter:description"
      content="Curated timeless Scandinavian furniture and lighting."
    />
    <meta
      name="twitter:image"
      content="https://images.unsplash.com/photo-1586023492125-27b2c045efd7?q=80&w=1200&auto=format&fit=crop"
    />

    <!-- Performance Preconnects for CDNs and External Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
